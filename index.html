<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a130d">
    <title>Nuestro pequeño jardín 🌻</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Dancing+Script:wght@500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/sections.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>

    <!-- Capas de transición -->
    <div id="veil" class="veil" aria-hidden="true"></div>
    <div id="petalFx" class="petal-fx" aria-hidden="true"></div>

    <!-- Música -->
    <button id="musicBtn" class="music-btn" type="button" aria-label="Activar música" title="Música">
        <span class="mi">🎵</span>
    </button>

    <!-- ============ APP ============ -->
    <main id="app">

        <!-- 1 · LA SEMILLA -->
        <section id="screen-seed" class="screen active" data-screen="seed" role="region" aria-label="La semilla" tabindex="-1">
            <div class="seed-stage">
                <div class="bloom" aria-hidden="true"></div>
                <div class="leaf leaf--l" aria-hidden="true"></div>
                <div class="leaf leaf--r" aria-hidden="true"></div>
                <div class="stem" aria-hidden="true"></div>
                <div class="seed" aria-hidden="true"></div>
                <div class="petal-layer" id="seedPetals" aria-hidden="true"></div>
            </div>
            <div class="seed-copy">
                <p class="line"><span id="seedLine1"></span></p>
                <p class="line"><span id="seedLine2"></span></p>
                <button id="btnSeed" class="btn btn--primary" type="button">🌱 Comenzar</button>
            </div>
        </section>

        <!-- 2 · LA FLOR -->
        <section id="screen-flower" class="screen" data-screen="flower" role="region" aria-label="La flor" tabindex="-1">
            <div class="flower-halo" aria-hidden="true"></div>
            <div class="flower-stage" aria-hidden="true">
                <div class="big-flower" id="bigFlower"></div>
            </div>
            <div class="copy flower-copy">
                <h2 class="fx fx-title" id="flTitle"></h2>
                <p class="fx" id="flL1"></p>
                <p class="fx" id="flL2"></p>
                <button id="btnFlower" class="btn btn--gold fx" type="button">Descubrir 🌻</button>
            </div>
        </section>

        <!-- 3 · EL JARDÍN -->
        <section id="screen-garden" class="screen screen--scroll" data-screen="garden" role="region" aria-label="El jardín" tabindex="-1">
            <div class="garden-bg" aria-hidden="true">
                <div class="garden-sky"></div>
                <div class="garden-sun"></div>
                <div class="garden-hills"></div>
            </div>
            <div class="garden-stage" id="gardenStage" aria-hidden="true"></div>
            <div class="garden-sparkles" id="gardenSparkles" aria-hidden="true"></div>
            <div class="garden-petals petal-layer" id="gardenPetals" aria-hidden="true"></div>
            <div class="copy glass garden-copy">
                <p class="fx" id="gaL1"></p>
                <p class="fx" id="gaL2"></p>
                <h3 class="fx fx-em" id="gaL2b"></h3>
                <p class="fx" id="gaL3"></p>
                <button id="btnGarden" class="btn btn--primary fx" type="button">Hay algo más...</button>
            </div>
        </section>

        <!-- 4 · NUESTRA HISTORIA -->
        <section id="screen-story" class="screen screen--scroll" data-screen="story" role="region" aria-label="Nuestra historia" tabindex="-1">
            <header class="screen-title">
                <h2 id="stTitle"></h2>
                <p class="sub" id="stSub"></p>
            </header>
            <div class="gallery" id="gallery">
                <div class="gallery-viewport" id="galleryViewport">
                    <div class="gallery-track" id="galleryTrack"></div>
                </div>
                <button class="gal-arrow gal-prev" id="galPrev" type="button" aria-label="Foto anterior">‹</button>
                <button class="gal-arrow gal-next" id="galNext" type="button" aria-label="Foto siguiente">›</button>
                <div class="gal-dots" id="galDots"></div>
                <div class="gal-count" id="galCount"></div>
            </div>
            <button id="stNext" class="btn btn--primary st-next" type="button">Seguir 💛</button>
        </section>

        <!-- 5 · NUESTRO TIEMPO -->
        <section id="screen-time" class="screen screen--scroll" data-screen="time" role="region" aria-label="Nuestro tiempo" tabindex="-1">
            <div class="time-orbs" aria-hidden="true"></div>
            <header class="screen-title">
                <h2 class="fx" id="tiTitle"></h2>
                <h3 class="fx fx-em" id="tiTitle2"></h3>
            </header>
            <div class="counter" id="counter" aria-label="Tiempo juntos">
                <div class="chip"><span class="num" id="ctDays">0</span><small>días</small></div>
                <div class="chip"><span class="num" id="ctHours">00</span><small>horas</small></div>
                <div class="chip"><span class="num" id="ctMins">00</span><small>minutos</small></div>
                <div class="chip"><span class="num" id="ctSecs">00</span><small>segundos</small></div>
            </div>
            <p class="time-footer fx" id="tiFooter"></p>
            <button id="tiNext" class="btn btn--primary ti-next" type="button">Seguir 💛</button>
        </section>

        <!-- 6 · LAS RAZONES -->
        <section id="screen-razones" class="screen screen--scroll" data-screen="razones" role="region" aria-label="Las razones" tabindex="-1">
            <header class="screen-title">
                <h2 id="rzTitle"></h2>
                <p class="sub" id="rzSub"></p>
            </header>
            <div class="rz-stage" id="rzStage" aria-hidden="true"></div>
            <div class="rz-counter" id="rzCounter" role="status" aria-live="polite"></div>
            <div class="rz-card" id="rzCard" aria-live="polite">
                <small id="rzCardNum"></small>
                <p id="rzMsg"></p>
            </div>
            <div class="rz-done" id="rzDone" role="status"></div>
            <button id="rzNext" class="btn btn--primary rz-next" type="button" hidden>Continuar 😊</button>
        </section>

        <!-- 7 · NUESTRA CANCIÓN -->
        <section id="screen-cancion" class="screen screen--scroll" data-screen="cancion" role="region" aria-label="Nuestra canción" tabindex="-1">
            <div class="song-stage" aria-hidden="true">
                <div class="vinyl" id="vinyl">
                    <div class="vinyl-disc" id="vinylDisc"></div>
                </div>
            </div>
            <header class="screen-title">
                <h2 id="cnTitle"></h2>
                <p class="sub" id="cnSub"></p>
            </header>
            <div class="song-card">
                <p class="song-name" id="cnName"></p>
                <p class="song-artist" id="cnArtist"></p>
                <p class="song-why" id="cnWhy"></p>
                <p class="song-note" id="cnNote"></p>
                <button id="cnPlay" class="btn btn--primary" type="button">▶ Reproducir</button>
            </div>
            <div class="song-actions">
                <button id="cnNext" class="btn btn--gold" type="button">Seguir 💛</button>
            </div>
        </section>

        <!-- 8 · PROMESAS -->
        <section id="screen-promesas" class="screen screen--scroll" data-screen="promesas" role="region" aria-label="Promesas" tabindex="-1">
            <header class="screen-title">
                <h2 id="pmTitle"></h2>
                <p class="sub" id="pmSub"></p>
            </header>
            <ul class="pm-list" id="pmList"></ul>
            <button id="pmNext" class="btn btn--primary" type="button" hidden>Una cosa más...</button>
        </section>

        <!-- 9 · LA CARTA -->
        <section id="screen-letter" class="screen" data-screen="letter" role="region" aria-label="La carta" tabindex="-1">
            <div class="letter-bg" aria-hidden="true"></div>
            <p class="fx lead" id="leLead"></p>
            <div class="envelope-wrap">
                <div class="envelope" id="envelope" aria-hidden="true">
                    <div class="env-back"></div>
                    <div class="env-sheet" id="envSheet">
                        <div class="sheet-paper"></div>
                    </div>
                    <div class="env-front"></div>
                    <div class="env-flap">
                        <div class="env-seal">💛</div>
                    </div>
                </div>
                <button id="btnLetter" class="btn btn--gold" type="button">💌 Abrir carta</button>
            </div>
            <div class="letter-card" id="letterCard" role="region" aria-label="Tu carta">
                <div class="letter-paper">
                    <div class="letter-body" id="letterBody"></div>
                    <div class="letter-hearts" aria-hidden="true">🌻 💛 🌻</div>
                    <button id="leNext" class="btn btn--primary le-next" type="button">Seguir 💛</button>
                </div>
            </div>
        </section>

        <!-- 10 · LA FLOR DE LOS RECUERDOS -->
        <section id="screen-remembrance" class="screen screen--scroll" data-screen="remembrance" role="region" aria-label="La flor de los recuerdos" tabindex="-1">
            <header class="screen-title">
                <h2 id="reTitle"></h2>
                <p class="sub" id="reSub"></p>
            </header>
            <div class="rf-stage">
                <div class="rf-flower" id="rfFlower">
                    <div class="rf-core" aria-hidden="true">💛</div>
                </div>
                <button class="rf-petal rf-last" id="rfLast" type="button" aria-label="El último pétalo" hidden>✨</button>
            </div>
            <div class="rf-found" id="rfFound" role="status" aria-live="polite"></div>
            <div class="rf-card" id="rfCard" aria-live="polite">
                <small id="rfCardTag"></small>
                <p id="rfMsg"></p>
            </div>
            <div id="rfMsgBanner" class="rf-banner" role="status"></div>
        </section>

        <!-- 11 · EL ÚLTIMO PÉTALO -->
        <section id="screen-last" class="screen" data-screen="last" role="region" aria-label="El último pétalo" tabindex="-1">
            <div id="darkFx" class="dark-fx" aria-hidden="true"></div>
            <div class="last-quotes" id="lastQuotes"></div>
            <div class="burst" id="burst" aria-hidden="true"></div>
        </section>

        <!-- 12 · FINAL -->
        <section id="screen-finale" class="screen screen--scroll" data-screen="finale" role="region" aria-label="Para ti" tabindex="-1">
            <div class="sunset" aria-hidden="true">
                <div class="sun-glow"></div>
                <div class="sun" id="sun"></div>
                <div class="hills hills--back"></div>
                <div class="hills hills--mid"></div>
                <div class="hills hills--near"></div>
                <div class="field" id="field"></div>
            </div>
            <div class="field-flowers" id="finaleFlowers" aria-hidden="true"></div>
            <div class="finale-petals petal-layer" id="finalePetals" aria-hidden="true"></div>
            <div class="finale-copy">
                <h2 class="fx fx-title" id="fiTitle"></h2>
                <p class="fx" id="fiThanks"></p>
                <h3 class="fx fx-em" id="fiLove"></h3>
                <p class="fx sign" id="fiSign"></p>
            </div>
        </section>

    </main>

    <!-- Indicador de progreso discreto -->
    <nav id="progress" class="progress" aria-label="Progreso de la historia"></nav>

    <script src="config/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/audio.js"></script>
    <script src="js/core/app.js"></script>
    <script src="js/components/seed.js"></script>
    <script src="js/components/flower.js"></script>
    <script src="js/components/garden.js"></script>
    <script src="js/components/gallery.js"></script>
    <script src="js/components/counter.js"></script>
    <script src="js/components/razones.js"></script>
    <script src="js/components/cancion.js"></script>
    <script src="js/components/promesas.js"></script>
    <script src="js/components/letter.js"></script>
    <script src="js/components/remembrance.js"></script>
    <script src="js/components/last.js"></script>
    <script src="js/components/finale.js"></script>
    <script>App.boot();</script>
</body>
</html>
